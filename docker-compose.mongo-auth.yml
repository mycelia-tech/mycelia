# Explicit opt-in migration overlay. Do not apply to an existing data directory
# until users, an authenticated backup, a restore drill and rollback are ready.
services:
  mongo:
    entrypoint: ["docker-entrypoint.sh"]
    command: ["mongod", "--config", "/etc/mongod.conf"]
    environment:
      MONGO_HEALTH_USERNAME: ${MONGO_HEALTH_USERNAME:?Set a clusterMonitor user}
      MONGO_HEALTH_PASSWORD: ${MONGO_HEALTH_PASSWORD:?Set the monitor password}
    volumes:
      - ./misc/mongo/mongod.auth.conf:/etc/mongod.conf:ro
      - ${MONGO_KEYFILE_PATH:?Set a protected Mongo replica keyfile}:/run/secrets/mongo-keyfile:ro
      - ./misc/mongo/healthcheck-auth.js:/healthcheck-auth.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--norc", "admin", "--file", "/healthcheck-auth.js"]
      interval: 60s
      timeout: 10s
      start_period: 90s
      retries: 5
